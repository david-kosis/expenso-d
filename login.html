<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Expenso</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5fa;color:#172033;font:16px/1.5 Inter,system-ui,sans-serif}.card{width:min(92vw,420px);padding:36px;border-radius:22px;background:#fff;box-shadow:0 20px 70px #1a2a4a16}.brand{font-size:27px;font-weight:800;color:#d92d43;margin-bottom:8px}.muted{color:#687386;margin:0 0 26px}label{display:block;font-size:14px;font-weight:650;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d8deea;border-radius:10px;font:inherit}input:focus{outline:3px solid #d92d4322;border-color:#d92d43}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:22px;background:#d92d43;color:white;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#b91f35}.note{font-size:12px;color:#737e91;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Expenso</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to your business workspace.</p>
    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter any password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="note">Demo only: credentials are not verified. Do not use this login to protect real business or financial information.</p>
  </main>
  <script src="demo-login-bypass.js"></script>
</body>
</html>
